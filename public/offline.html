<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غير متصل - نظام محاسبة القات</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 50%, #bbf7d0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            direction: rtl;
        }

        .container {
            text-align: center;
            max-width: 500px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s infinite;
        }

        .icon svg {
            width: 60px;
            height: 60px;
            fill: white;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 0 20px rgba(16, 185, 129, 0);
            }
        }

        h1 {
            color: #1f2937;
            font-size: 28px;
            margin-bottom: 15px;
        }

        p {
            color: #6b7280;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .retry-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        .retry-btn:active {
            transform: translateY(0);
        }

        .tips {
            margin-top: 30px;
            padding: 20px;
            background: #f0fdf4;
            border-radius: 10px;
            text-align: right;
        }

        .tips h3 {
            color: #059669;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .tips ul {
            list-style: none;
            color: #6b7280;
            font-size: 14px;
        }

        .tips li {
            padding: 5px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tips li::before {
            content: '✓';
            color: #10b981;
            font-weight: bold;
        }

        .status {
            margin-top: 20px;
            padding: 10px;
            background: #fef3c7;
            border-radius: 8px;
            color: #92400e;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .icon {
                width: 100px;
                height: 100px;
            }

            .icon svg {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
        </div>

        <h1>أنت غير متصل بالإنترنت</h1>

        <p>
            لا يمكن الاتصال بالإنترنت حالياً.
            يرجى التحقق من اتصالك بالشبكة والمحاولة مرة أخرى.
        </p>

        <button class="retry-btn" onclick="location.reload()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
            </svg>
            إعادة المحاولة
        </button>

        <div class="tips">
            <h3>نصائح:</h3>
            <ul>
                <li>تحقق من اتصال الواي فاي</li>
                <li>حاول تشغيل وضع الطيران وإيقافه</li>
                <li>أعد تشغيل جهازك</li>
                <li>البيانات المحفوظة سابقاً متاحة للتصفح</li>
            </ul>
        </div>

        <div class="status" id="status">
            جاري محاولة الاتصال...
        </div>
    </div>

    <script>
        // التحقق من الاتصال
        function checkConnection() {
            if (navigator.onLine) {
                document.getElementById('status').textContent = 'تم استعادة الاتصال!';
                document.getElementById('status').style.background = '#d1fae5';
                document.getElementById('status').style.color = '#065f46';
                setTimeout(() => {
                    location.reload();
                }, 1000);
            } else {
                document.getElementById('status').textContent = 'لا يزال غير متصل...';
            }
        }

        // مراقبة حالة الاتصال
        window.addEventListener('online', checkConnection);
        window.addEventListener('offline', () => {
            document.getElementById('status').textContent = 'تم فقد الاتصال';
            document.getElementById('status').style.background = '#fef3c7';
            document.getElementById('status').style.color = '#92400e';
        });

        // تحقق دوري
        setInterval(() => {
            if (navigator.onLine) {
                fetch('/api/dashboard/overview')
                    .then(response => {
                        if (response.ok) {
                            location.reload();
                        }
                    })
                    .catch(() => {});
            }
        }, 10000);
    </script>
</body>
</html>
